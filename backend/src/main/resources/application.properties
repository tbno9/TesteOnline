spring.application.name=testeOnline

# conexiunea la postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/teste
spring.datasource.username=postgres
spring.datasource.password=${PAROLA_DB}

# schema e creata de flyway, hibernate doar o verifica
spring.jpa.hibernate.ddl-auto=validate

# conexiunea se incihide la iesirea din service
spring.jpa.open-in-view=false

# pentru a afisa in consola sql-ul generat:
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always

# cheia cu care serverul semneaza token-urile JWT (minim 32 de caractere)
# in productie vine din variabila de mediu JWT_SECRET; dupa ":" e valoarea de laborator
app.jwt.secret=${JWT_SECRET:teste-online-cheie-laborator-proiectare-aplicatii-web}
# cat timp e valabil un token: PT1H = 1 ora (format ISO-8601)
app.jwt.valabilitate=PT1H