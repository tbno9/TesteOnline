spring.application.name=testeOnline

# conexiunea la postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/teste
spring.datasource.username=postgres
spring.datasource.password=${PAROLA_DB}

# schema e creata de flyway, hibernate doar o verifica
spring.jpa.hibernate.ddl-auto=validate

# conexiunea se incihide la iesirea din service
spring.jpa.open-in-view=false

# pentru a afisa in consola sql-ul generat:
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always